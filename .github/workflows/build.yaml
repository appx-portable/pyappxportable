name: Build and publish Python distribution

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: python-distribution-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        if: github.ref == 'refs/heads/main' && github.repository == 'yell0wsuit/pyappxportable'
        runs-on: ubuntu-latest
        outputs:
            release: ${{ steps.version.outputs.release }}
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
        steps:
            - uses: actions/checkout@main
              with:
                  persist-credentials: false
            - uses: actions/setup-python@main
              with:
                  python-version: '3.x'
            - run: python -m pip install packaging
            - name: Determine release version
              id: version
              env:
                  GH_TOKEN: ${{ github.token }}
              run: python scripts/release.py

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@main
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-python@main
              with:
                  python-version: '3.x'
            - run: python -m pip install -e '.[dev]'
            - run: python -m pylint src/pyappxportable scripts/release.py
            - run: python -m black --check src/pyappxportable scripts tests
            - run: python -m unittest discover -s tests

    build:
        needs: [version, lint]
        if: always() && needs.lint.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@main
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-python@main
              with:
                  python-version: '3.x'
            - run: python -m pip install build twine
            - name: Set automatic release version
              if: needs.version.outputs.release == 'true'
              env:
                  RELEASE_VERSION: ${{ needs.version.outputs.version }}
              run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
            - run: python -m build
            - name: Verify release distribution versions
              if: needs.version.outputs.release == 'true'
              env:
                  RELEASE_VERSION: ${{ needs.version.outputs.version }}
              run: |
                  test -f "dist/pyappxportable-$RELEASE_VERSION-py3-none-any.whl"
                  test -f "dist/pyappxportable-$RELEASE_VERSION.tar.gz"
            - run: python -m twine check dist/*
            - uses: actions/upload-artifact@main
              with:
                  name: python-package-distributions
                  path: dist/
                  if-no-files-found: error

    smoke:
        needs: build
        if: always() && needs.build.result == 'success'
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python: ['3.9', '3.x']
                exclude:
                    - os: macos-latest
                      python: '3.9'
        runs-on: ${{ matrix.os }}
        env:
            PYAPPXPORTABLE_NO_UPDATE_CHECK: '1'
        steps:
            - uses: actions/setup-python@main
              with:
                  python-version: ${{ matrix.python }}
            - uses: actions/download-artifact@main
              with:
                  name: python-package-distributions
                  path: dist/
            - name: Install wheel
              shell: bash
              run: python -m pip install dist/*.whl
            - run: pyappxportable --help
            - run: python -m pyappxportable --version
            - run: python -c "from pyappxportable import InstallError, Manifest, install_game"

    publish-to-pypi:
        if: always() && needs.version.outputs.release == 'true' && needs.build.result == 'success' && needs.smoke.result == 'success'
        needs: [version, build, smoke]
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/pyappxportable
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/download-artifact@main
              with:
                  name: python-package-distributions
                  path: dist/
            - uses: pypa/gh-action-pypi-publish@release/v1
            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ needs.version.outputs.tag }}
                  RELEASE_COMMIT: ${{ github.sha }}
              run: gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --generate-notes --latest
