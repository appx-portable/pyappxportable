name: Build and publish Python distribution

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@main
              with:
                  persist-credentials: false
            - uses: actions/setup-python@main
              with:
                  python-version: '3.x'
            - run: python -m pip install -e '.[dev]'
            - run: python -m pylint src/pyappxportable
            - run: python -m black --check src/pyappxportable

    build:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@main
              with:
                  persist-credentials: false
            - uses: actions/setup-python@main
              with:
                  python-version: '3.x'
            - run: python -m pip install build twine
            - name: Check release tag matches package version
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  python - <<'PY'
                  import os
                  import tomllib
                  with open('pyproject.toml', 'rb') as stream:
                      version = tomllib.load(stream)['project']['version']
                  assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match project.version'
                  PY
            - run: python -m build
            - run: python -m twine check dist/*
            - uses: actions/upload-artifact@main
              with:
                  name: python-package-distributions
                  path: dist/
                  if-no-files-found: error

    smoke:
        needs: build
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python: ['3.8', '3.x']
                exclude:
                    - os: macos-latest
                      python: '3.8'
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/setup-python@main
              with:
                  python-version: ${{ matrix.python }}
            - uses: actions/download-artifact@main
              with:
                  name: python-package-distributions
                  path: dist/
            - name: Install wheel
              shell: bash
              run: python -m pip install dist/*.whl
            - run: pyappxportable --help
            - run: python -m pyappxportable --help
            - run: python -c "from pyappxportable import InstallError, Manifest, install_game"

    publish-to-pypi:
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'yell0wsuit/pyappxportable'
        needs: [build, smoke]
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/pyappxportable
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/download-artifact@main
              with:
                  name: python-package-distributions
                  path: dist/
            - uses: pypa/gh-action-pypi-publish@release/v1
